services:
  backend:
    build:
      context: ./backend
    ports:
      # Host side is configurable; the container always listens on
      # 8080 internally (set explicitly below), matching the backend
      # Dockerfile's EXPOSE.
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      # Must be the origin the browser actually loads the frontend
      # from (its host-mapped port), never the "frontend" service name
      # — the browser cannot resolve Compose's internal network.
      CORS_ALLOWED_ORIGINS: "http://localhost:${FRONTEND_PORT:-3000}"
      CALC_PRECISION: "2"

  frontend:
    build:
      context: ./frontend
      args:
        # Must be the backend's host-mapped port as seen by the
        # browser, never "http://backend:8080" — that address only
        # resolves inside Compose's internal network, not from the
        # browser running on the host.
        VITE_API_BASE_URL: "http://localhost:${BACKEND_PORT:-8080}"
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
